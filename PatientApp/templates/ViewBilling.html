{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Billing | Hospital Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="{% static 'default.css' %}" rel="stylesheet" type="text/css" media="screen" />
</head>
<body class="min-h-screen bg-slate-100">
    <header class="bg-slate-900 text-white shadow-sm">
        <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-semibold">Insurance Billing</h1>
                <p class="text-slate-300">Search patient bills by name.</p>
            </div>
            <nav class="flex gap-3 flex-wrap">
                <a href="{% url 'ViewBilling' %}" class="bg-cyan-500 hover:bg-cyan-600 text-white px-4 py-2 rounded-lg transition">View Billing</a>
                <a href="{% url 'index' %}" class="text-slate-200 hover:text-white px-4 py-2 rounded-lg transition">Logout</a>
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-4 py-10">
        <div class="max-w-2xl mx-auto bg-white rounded-[28px] shadow-xl overflow-hidden border border-slate-200">
            <div class="bg-gradient-to-r from-cyan-500 to-sky-600 p-8 text-white text-center">
                <h2 class="text-3xl font-semibold">Billing Lookup</h2>
                <p class="mt-2 text-slate-200">Find billing records quickly for any patient.</p>
            </div>
            <div class="p-8 space-y-6">
                {% if data %}
                <div class="rounded-2xl border border-red-200 bg-red-50 p-4 text-red-700">
                    {{ data|safe }}
                </div>
                {% endif %}
                <form method="post" action="ViewBillingAction" class="space-y-5">
                    {% csrf_token %}
                    <div>
                        <label for="t1" class="block text-sm font-medium text-slate-700">Patient Name</label>
                        <input id="t1" name="t1" type="text" placeholder="Enter patient name" required class="mt-2 w-full rounded-2xl border border-slate-300 bg-slate-50 px-4 py-3 text-slate-900 outline-none transition focus:border-cyan-500 focus:ring-2 focus:ring-cyan-200" />
                    </div>
                    <button type="submit" class="w-full rounded-2xl bg-sky-600 py-3 text-white font-semibold shadow-lg shadow-sky-200/50 transition hover:bg-sky-700">Search Bills</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
